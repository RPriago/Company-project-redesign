services:
  - type: web
    name: petronesia-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - "**/*_test.go"
        - backend/cmd/**
        - "**/*.db"
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
